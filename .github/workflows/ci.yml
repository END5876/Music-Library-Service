name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 每週一重建一次映像：確認 Dockerfile 仍可建置（上游 yt-dlp / bgutil 版本會變）
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # 正式環境會裝到的套件（--omit=dev）有 high 以上的漏洞就讓 CI 失敗
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t music-library-service:ci .
      - name: Smoke test
        run: |
          docker run -d --name mls -p 4100:4100 -e MUSIC_LIB_SECRET=ci-secret music-library-service:ci
          for i in $(seq 1 20); do curl -fs localhost:4100/health && break; sleep 1; done
          curl -fs -H 'x-music-lib-key: ci-secret' localhost:4100/api/music/status
          # 服務以 node（非 root）身分執行，且能寫入音樂庫
          test "$(docker exec mls sh -c 'stat -c %U /proc/$(cat /proc/1/task/1/children | cut -d" " -f1)')" = node
          curl -fs -X PUT -H 'x-music-lib-key: ci-secret' --data-binary 'x' localhost:4100/api/music/file/ci/test.mp3
          curl -fs -H 'x-music-lib-key: ci-secret' localhost:4100/api/music/file/ci/test.mp3
          docker exec mls yt-dlp --version
          docker logs mls
          docker rm -f mls
