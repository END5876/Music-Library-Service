<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0b">
<title>音樂庫播放器</title>
<style>
:root{
  --bg:#0b0b0b; --surface:#181818; --surface2:#242424; --text:#fff; --muted:#aaa;
  --accent:#ff2d55; --header-h:64px; --player-h:72px; --nav-h:56px;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",Roboto,sans-serif;overflow:hidden;height:100vh;height:100dvh}
button{background:none;border:0;color:inherit;cursor:pointer;font:inherit;display:inline-flex;align-items:center;justify-content:center}
button:disabled{cursor:default;opacity:.4}
svg{width:24px;height:24px;fill:currentColor;flex-shrink:0}
ul{list-style:none}
audio{display:none}

/* ===== Header ===== */
header{position:fixed;top:0;left:0;right:0;height:calc(var(--header-h) + var(--safe-top));padding:var(--safe-top) 16px 0;display:flex;align-items:center;gap:12px;background:rgba(11,11,11,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:30;border-bottom:1px solid #222}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;letter-spacing:-.5px;white-space:nowrap}
.logo i{width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--accent),#ff8a00,var(--accent));display:grid;place-items:center}
.logo i::after{content:"";border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.search{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:10px;padding:0 14px;height:42px;color:var(--muted);min-width:0}
.search input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:15px;min-width:0;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7f5af0,#2cb67d);margin-left:auto;flex-shrink:0}
.avatar svg{width:20px;height:20px}

/* ===== Sidebar ===== */
aside{position:fixed;top:calc(var(--header-h) + var(--safe-top));bottom:var(--player-h);left:0;width:220px;padding:12px;border-right:1px solid #222;overflow-y:auto;z-index:20;background:var(--bg)}
.navitem{display:flex;align-items:center;gap:20px;width:100%;padding:12px 16px;border-radius:10px;color:#ddd;font-size:15px;justify-content:flex-start}
.navitem:hover{background:var(--surface)}
.navitem.active{background:var(--surface2);color:#fff;font-weight:600}
.side-sep{height:1px;background:#222;margin:12px 0}
.side-note{padding:8px 16px;color:var(--muted);font-size:12px;line-height:1.6}

/* ===== Main ===== */
main{position:fixed;top:calc(var(--header-h) + var(--safe-top));left:220px;right:0;bottom:var(--player-h);overflow-y:auto;padding:20px 28px 40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:8px;background:var(--surface2);font-size:14px;white-space:nowrap}
.chip.active,.chip:hover{background:#fff;color:#000}
section{margin-top:28px}
.chips + section{margin-top:24px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;gap:8px}
.sec-head small{color:var(--muted);font-size:12px;letter-spacing:1px;display:block;margin-bottom:2px}
.sec-head h2{font-size:28px;font-weight:700}
.sec-head .more{border:1px solid #444;border-radius:16px;padding:6px 14px;font-size:13px;white-space:nowrap}
.sec-head .more:hover{background:var(--surface2)}
.hint,.empty{color:var(--muted);font-size:14px;padding:4px 0 14px}
.empty{padding:32px 0;text-align:center}

.cover{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:32px;position:relative;overflow:hidden;background:#333}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.25),transparent 55%)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.cover:has(img)::after{display:none}

/* Track rows */
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:4px 24px}
.row{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:8px;cursor:pointer;position:relative}
.row:hover,.row.playing{background:var(--surface)}
.row .cover{width:48px;font-size:20px;flex-shrink:0;border-radius:4px}
.row .info{flex:1;min-width:0}
.t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row.playing .t{color:var(--accent)}
.row .dur{color:var(--muted);font-size:13px;white-space:nowrap}
.rbtn{width:36px;height:36px;border-radius:50%;color:#ccc;opacity:.55;flex-shrink:0}
.rbtn:hover{opacity:1;background:#2a2a2a;color:#fff}

/* ===== Player bar ===== */
.player{position:fixed;left:0;right:0;bottom:0;height:var(--player-h);background:#181818;z-index:40;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 16px;gap:16px}
.bar-progress{position:absolute;top:-8px;left:0;right:0;height:16px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,0%),#4a4a4a var(--p,0%));outline:0;cursor:pointer}
input[type=range]:disabled{cursor:default;opacity:1}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0;border-radius:50%;background:#fff;transition:.15s}
input[type=range]:not(:disabled):hover::-webkit-slider-thumb,.full input[type=range]:not(:disabled)::-webkit-slider-thumb{width:13px;height:13px}
input[type=range]::-moz-range-thumb{width:0;height:0;border:0}
input[type=range]:not(:disabled):hover::-moz-range-thumb,.full input[type=range]:not(:disabled)::-moz-range-thumb{width:13px;height:13px;border:0;background:#fff;border-radius:50%}
.bar-progress input{position:absolute;top:6px;height:3px;border-radius:0}
.ctrls{display:flex;align-items:center;gap:6px;justify-self:start}
.ctrls button{width:44px;height:44px;border-radius:50%}
.ctrls button:hover{background:#2a2a2a}
.ctrls .big{width:48px;height:48px}
.ctrls .big svg{width:36px;height:36px}
.time{font-size:12px;color:var(--muted);margin-left:10px;white-space:nowrap}
.now{display:flex;align-items:center;gap:12px;min-width:0;justify-self:center;width:100%;max-width:520px;cursor:pointer}
.now .cover{width:48px;font-size:20px;border-radius:4px;flex-shrink:0}
.now .info{min-width:0;flex:1}
.right{display:flex;align-items:center;gap:4px;justify-self:end}
.right button{width:40px;height:40px;border-radius:50%;color:#ccc}
.right button:hover{background:#2a2a2a;color:#fff}
.right button.on{color:var(--accent)}
.vol{display:flex;align-items:center;width:130px}

/* Toast（狀態訊息）*/
.toast{position:fixed;left:50%;bottom:calc(var(--player-h) + 16px);transform:translate(-50%,8px);max-width:min(560px,calc(100vw - 32px));background:#2a2a2a;color:#fff;font-size:13px;line-height:1.5;padding:10px 16px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== Mini player + bottom nav (mobile) ===== */
.mini,.bottom-nav{display:none}

/* ===== Full-screen player ===== */
.full{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,var(--c1,#333),#0b0b0b 85%);transform:translateY(100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s;display:flex;flex-direction:column;padding:var(--safe-top) 0 var(--safe-bottom)}
.full.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s}
.full-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.full-top button{width:44px;height:44px;border-radius:50%}
.full-top button:hover{background:rgba(255,255,255,.1)}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.3);border-radius:20px;padding:3px}
.tab{padding:6px 18px;border-radius:16px;font-size:14px;color:#ccc}
.tab.active{background:rgba(255,255,255,.18);color:#fff}
.full-body{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:0 48px 16px;min-height:0;max-width:1200px;width:100%;margin:0 auto}
.left-pane{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;min-height:0}
.big-cover{width:min(100%,46vh,440px);font-size:110px;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);transition:transform .3s}
.big-cover.paused{transform:scale(.92)}
.meta{width:min(100%,440px)}
.meta .t{font-size:22px;font-weight:700}
.meta .a{font-size:15px}
.seek{width:min(100%,440px)}
.seek .times{display:flex;justify-content:space-between;font-size:12px;color:#bbb;margin-top:8px}
.fctrls{display:flex;align-items:center;gap:10px;width:min(100%,440px);justify-content:space-between}
.fctrls button{width:48px;height:48px;border-radius:50%}
.fctrls button.on{color:var(--accent)}
.fctrls .play-big{width:68px;height:68px;background:#fff;color:#000}
.fctrls .play-big svg{width:38px;height:38px}
.queue{overflow-y:auto;min-height:0;padding:4px 0}
.queue h3{font-size:14px;color:#ccc;margin:6px 8px 10px;font-weight:500}
.queue .row:hover,.queue .row.playing{background:rgba(255,255,255,.1)}
.queue .note{color:#ccc;font-size:13px;padding:8px}

/* ===== Login ===== */
.login{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px;z-index:80}
.login.show{display:flex}
.login .box{background:var(--surface);border:1px solid #2a2a2a;border-radius:16px;padding:28px 24px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.login .logo{justify-content:center;font-size:22px}
.login p{color:var(--muted);font-size:13px;text-align:center}
.login input{background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:12px 14px;color:#fff;font:inherit;font-size:15px;outline:0;min-width:0}
.login input:focus{border-color:var(--accent)}
.login .err{color:#ff6b81;font-size:13px;min-height:1.2em;text-align:center}
.login .go{background:var(--accent);color:#fff;border-radius:22px;padding:12px;font-weight:600}
.login .go:hover{filter:brightness(1.1)}

/* ===== Tablet ===== */
@media (max-width:1100px){
  .vol{display:none}
  .player{grid-template-columns:auto 1fr auto}
}
@media (max-width:900px){
  aside{display:none}
  main{left:0}
  .time{display:none}
}

/* ===== Mobile ===== */
@media (max-width:700px){
  :root{--header-h:56px}
  header{padding-left:16px;padding-right:12px}
  .logo span{display:none}
  .login .logo span{display:inline}
  .search{margin:0}
  main{padding:12px 16px 24px;bottom:calc(var(--nav-h) + var(--safe-bottom) + 70px)}
  .sec-head h2{font-size:22px}
  .quick{grid-template-columns:1fr}
  .toast{bottom:calc(var(--nav-h) + var(--safe-bottom) + 76px)}

  .player{display:none}
  .mini{display:block;position:fixed;left:8px;right:8px;bottom:calc(var(--nav-h) + var(--safe-bottom) + 6px);height:56px;background:#2a2a2a;border-radius:10px;z-index:40;overflow:hidden}
  .mini-in{display:flex;align-items:center;gap:12px;height:100%;padding:0 6px 3px 8px}
  .mini .cover{width:40px;font-size:16px;border-radius:4px;flex-shrink:0}
  .mini .info{flex:1;min-width:0}
  .mini button{width:42px;height:42px;border-radius:50%}
  .mini-prog{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);width:0}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:#121212;z-index:35;border-top:1px solid #222}
  .bottom-nav button{flex:1;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}
  .bottom-nav button.active{color:#fff}

  .full-body{grid-template-columns:1fr;padding:0 24px 16px;gap:0}
  .full-body .queue{display:none}
  .full[data-tab="queue"] .left-pane{display:none}
  .full[data-tab="queue"] .queue{display:block}
  .big-cover{width:min(100%,42vh);font-size:90px}
  .left-pane{gap:16px}
}
@media (min-width:701px){ .tabs{display:none} }
</style>
</head>
<body>

<svg style="display:none">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6v12h2V6z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M10.6 9.2L5.4 4 4 5.4l5.2 5.2zM14.5 4l2.05 2.05L4 18.6 5.4 20l12.55-12.55L20 9.5V4zm.3 9.4l-1.4 1.4 3.15 3.15L14.5 20H20v-5.5l-2.05 2.05z"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></symbol>
  <symbol id="i-repeat1" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2zm-4-2V9h-1l-2 1v1h1.5v4z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0014 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></symbol>
  <symbol id="i-explore" viewBox="0 0 24 24"><path d="M12 10.9a1.1 1.1 0 100 2.2 1.1 1.1 0 000-2.2zM12 2a10 10 0 100 20 10 10 0 000-20zm2.2 12.2L6 18l3.8-8.2L18 6z"/></symbol>
  <symbol id="i-lib" viewBox="0 0 24 24"><path d="M4 6H2v14a2 2 0 002 2h14v-2H4zm16-4H8a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2zm-2 9.5l-4-2.2V14a2.5 2.5 0 11-1.5-2.3V5h2.5l3 2z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></symbol>
</svg>

<audio id="audio" preload="none"></audio>

<header>
  <div class="logo"><i></i><span>音樂庫</span></div>
  <form class="search" id="searchForm" role="search">
    <svg><use href="#i-search"/></svg>
    <input type="search" id="search" placeholder="搜尋歌名…" autocomplete="off" enterkeyhint="search">
  </form>
  <button class="avatar" id="logoutBtn" title="登出" aria-label="登出" hidden><svg><use href="#i-logout"/></svg></button>
</header>

<aside>
  <button class="navitem active" data-view="library"><svg><use href="#i-lib"/></svg>音樂庫</button>
  <button class="navitem needs-online" data-view="online" hidden><svg><use href="#i-explore"/></svg>線上搜尋</button>
  <div class="side-sep"></div>
  <div class="side-note">快捷鍵<br>空白：播放／暫停<br>N／P：下一首／上一首<br>S：隨機　R：循環<br>←／→：快退／快進 10 秒</div>
</aside>

<main id="main">
  <div id="viewLibrary">
    <div class="chips" id="chips" hidden></div>
    <section>
      <div class="sec-head">
        <div><small id="libCount">&nbsp;</small><h2>音樂庫</h2></div>
        <button class="more" id="shuffleAll">🔀 隨機播放</button>
      </div>
      <ul class="quick" id="list"></ul>
      <div class="empty" id="empty" hidden>沒有符合的曲目</div>
    </section>
  </div>

  <div id="viewOnline" hidden>
    <section style="margin-top:0">
      <div class="sec-head"><div><small>YouTube + Bilibili</small><h2>線上搜尋</h2></div></div>
      <div class="hint" id="onlineHint">在上方搜尋列輸入關鍵字後按 Enter，或直接貼上影片網址。點一下立即播放，「＋」加入佇列。</div>
      <ul class="quick" id="onlineResults"></ul>
    </section>
    <section id="queueSection" hidden>
      <div class="sec-head"><div><small id="queueCount"></small><h2>播放佇列</h2></div><button class="more" id="queueClear">清空佇列</button></div>
      <ul class="quick" id="queueList"></ul>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Desktop player bar -->
<div class="player">
  <div class="bar-progress"><input type="range" id="seek" min="0" max="1000" value="0" disabled aria-label="播放進度"></div>
  <div class="ctrls">
    <button id="prev" title="上一首 (P)"><svg><use href="#i-prev"/></svg></button>
    <button class="big" id="toggle" title="播放／暫停 (空白)"><svg><use href="#i-play"/></svg></button>
    <button id="next" title="下一首 (N)"><svg><use href="#i-next"/></svg></button>
    <span class="time" id="timeText">0:00 / 0:00</span>
  </div>
  <div class="now" id="nowOpen">
    <div class="cover" id="barCover"></div>
    <div class="info"><div class="t" id="barTitle"></div><div class="a" id="barArtist"></div></div>
  </div>
  <div class="right">
    <div class="vol"><svg style="margin-right:6px;color:#ccc"><use href="#i-vol"/></svg><input type="range" id="vol" min="0" max="100" value="100" aria-label="音量"></div>
    <button id="repeat" title="循環模式 (R)"><svg><use href="#i-repeat"/></svg></button>
    <button id="shuffle" title="隨機播放 (S)"><svg><use href="#i-shuffle"/></svg></button>
    <button id="expand" title="展開"><svg><use href="#i-up"/></svg></button>
  </div>
</div>

<!-- Mobile mini player -->
<div class="mini" id="mini">
  <div class="mini-in" id="miniOpen">
    <div class="cover" id="miniCover"></div>
    <div class="info"><div class="t" id="miniTitle"></div><div class="a" id="miniArtist"></div></div>
    <button id="miniToggle" aria-label="播放／暫停"><svg><use href="#i-play"/></svg></button>
    <button id="miniNext" aria-label="下一首"><svg><use href="#i-next"/></svg></button>
  </div>
  <div class="mini-prog" id="miniProg"></div>
</div>

<nav class="bottom-nav">
  <button class="active" data-view="library"><svg><use href="#i-lib"/></svg>音樂庫</button>
  <button class="needs-online" data-view="online" hidden><svg><use href="#i-explore"/></svg>線上搜尋</button>
</nav>

<!-- Full player -->
<div class="full" id="full" data-tab="player">
  <div class="full-top">
    <button id="close" aria-label="收合"><svg><use href="#i-down"/></svg></button>
    <div class="tabs">
      <button class="tab active" data-tab="player">歌曲</button>
      <button class="tab" data-tab="queue">接下來</button>
    </div>
    <span style="width:44px"></span>
  </div>
  <div class="full-body">
    <div class="left-pane">
      <div class="cover big-cover" id="bigCover"></div>
      <div class="meta"><div class="t" id="fTitle"></div><div class="a" id="fArtist"></div></div>
      <div class="seek">
        <input type="range" id="fSeek" min="0" max="1000" value="0" disabled aria-label="播放進度">
        <div class="times"><span id="fCur">0:00</span><span id="fDur">0:00</span></div>
      </div>
      <div class="fctrls">
        <button id="fShuffle" aria-label="隨機播放"><svg><use href="#i-shuffle"/></svg></button>
        <button id="fPrev" aria-label="上一首"><svg><use href="#i-prev"/></svg></button>
        <button class="play-big" id="fToggle" aria-label="播放／暫停"><svg><use href="#i-play"/></svg></button>
        <button id="fNext" aria-label="下一首"><svg><use href="#i-next"/></svg></button>
        <button id="fRepeat" aria-label="循環模式"><svg><use href="#i-repeat"/></svg></button>
      </div>
    </div>
    <div class="queue"><h3>接下來播放</h3><ul id="nextList"></ul></div>
  </div>
</div>

<div class="login" id="login">
  <form class="box" id="loginForm">
    <div class="logo"><i></i><span>音樂庫</span></div>
    <p>請輸入密碼</p>
    <input type="password" id="pw" placeholder="密碼" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="go" type="submit">登入</button>
  </form>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const audio = $('audio');
  const REPEATS = ['all', 'one', 'off'];
  const REPEAT_LABEL = { all: '循環：全部', one: '循環：單曲', off: '不循環' };

  // ── 封面：沒有專輯圖，就用檔名雜湊出固定的漸層＋圖示（線上歌曲則用縮圖）──
  const PALETTE = [
    ['#ff2d55', '#7f00ff'], ['#00c6ff', '#0072ff'], ['#f7971e', '#ffd200'], ['#5f7a61', '#2b3a2f'],
    ['#141e30', '#35577d'], ['#f5576c', '#f093fb'], ['#42275a', '#734b6d'], ['#11998e', '#38ef7d'],
    ['#fc466b', '#3f5efb'], ['#f9d423', '#ff4e50'], ['#89f7fe', '#66a6ff'], ['#3a1c71', '#d76d77'],
  ];
  const EMOJI = ['🎵', '🎶', '🎧', '🎼', '🎹', '🎸', '🎷', '🥁'];
  const NO_COVER = { c: ['#3a3a3a', '#1f1f1f'], emoji: '🎵', img: null };
  function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
  function coverFor(key, thumb) {
    const h = hash(String(key));
    return { c: PALETTE[h % PALETTE.length], emoji: EMOJI[(h >>> 4) % EMOJI.length],
             img: typeof thumb === 'string' && /^https?:\/\//i.test(thumb) ? thumb : null };
  }
  function paintCover(el, cv) {
    el.style.background = `linear-gradient(135deg,${cv.c[0]},${cv.c[1]})`;
    el.textContent = cv.emoji;
    if (cv.img) {
      const im = document.createElement('img');
      im.referrerPolicy = 'no-referrer'; im.alt = ''; im.loading = 'lazy';
      im.onerror = () => im.remove();
      im.src = cv.img;
      el.appendChild(im);
    }
  }

  // ── 狀態 ────────────────────────────────────────────────
  let all = [];           // 全部曲目
  let view = [];          // 目前篩選後的播放佇列
  let currentFile = null; // 目前播放的音樂庫 filename
  let onlineCurrent = null; // 目前播放的線上歌曲（null＝音樂庫歌曲）
  let onlineAvailable = false;
  let playToken = 0;      // 避免連點時舊的 info 回應蓋掉新的選擇
  let shuffle = false;
  let repeat = 'all';
  let history = [];       // 「上一首」堆疊
  let errorStreak = 0;
  let mode = 'library';
  let folder = '';
  let libQuery = '', onlineQuery = '';
  const queue = [];       // 線上歌曲佇列（優先於音樂庫下一首，行為同 Bot 的佇列）

  try {
    const s = JSON.parse(localStorage.getItem('ml_prefs') || '{}');
    if (typeof s.volume === 'number') audio.volume = Math.min(1, Math.max(0, s.volume));
    shuffle = !!s.shuffle;
    if (REPEATS.includes(s.repeat)) repeat = s.repeat;
  } catch {}
  function savePrefs() {
    try { localStorage.setItem('ml_prefs', JSON.stringify({ volume: audio.volume, shuffle, repeat })); } catch {}
  }

  const enc = encodeURIComponent;
  const streamUrl = (filename) => '/web/stream/' + filename.split('/').map(enc).join('/');
  const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const fmtSize = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
  const setIcon = (btn, name) => btn.querySelector('use').setAttribute('href', '#i-' + name);

  let toastTimer = null;
  function setStatus(text, sticky = false) {
    const el = $('toast');
    clearTimeout(toastTimer);
    if (!text) { el.classList.remove('show'); return; }
    el.textContent = text;
    el.classList.add('show');
    if (!sticky) toastTimer = setTimeout(() => el.classList.remove('show'), 6000);
  }

  // ── 登入 ────────────────────────────────────────────────
  function showLogin(msg) {
    $('login').classList.add('show');
    $('loginErr').textContent = msg || '';
    $('pw').focus();
  }
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('loginErr').textContent = '';
    try {
      const r = await fetch('/web/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: $('pw').value }),
      });
      if (r.ok) { $('pw').value = ''; $('login').classList.remove('show'); loadList(); return; }
      const j = await r.json().catch(() => ({}));
      $('loginErr').textContent = j.error || '登入失敗';
    } catch { $('loginErr').textContent = '連線失敗'; }
  });
  $('logoutBtn').addEventListener('click', async () => {
    audio.pause();
    await fetch('/web/logout', { method: 'POST' }).catch(() => {});
    all = []; view = []; queue.length = 0;
    currentFile = null; onlineCurrent = null; playToken++;
    audio.removeAttribute('src'); audio.load();
    setNow(null); render(); renderQueue();
    $('logoutBtn').hidden = true;
    showLogin();
  });

  // ── 列表元件 ────────────────────────────────────────────
  function makeRow({ key, cover, title, sub, dur, btn, onClick }) {
    const li = document.createElement('li');
    li.className = 'row'; li.dataset.key = key;
    const cv = document.createElement('div'); cv.className = 'cover'; paintCover(cv, cover);
    const info = document.createElement('div'); info.className = 'info';
    const t = document.createElement('div'); t.className = 't'; t.textContent = title; t.title = title;
    const a = document.createElement('div'); a.className = 'a'; a.textContent = sub;
    info.append(t, a);
    li.append(cv, info);
    if (dur) { const d = document.createElement('span'); d.className = 'dur'; d.textContent = dur; li.appendChild(d); }
    if (btn) {
      const b = document.createElement('button');
      b.className = 'rbtn'; b.title = btn.title; b.setAttribute('aria-label', btn.title);
      b.innerHTML = `<svg><use href="#i-${btn.icon}"/></svg>`;
      b.addEventListener('click', (ev) => { ev.stopPropagation(); btn.onClick(); });
      li.appendChild(b);
    }
    if (onClick) li.addEventListener('click', onClick);
    return li;
  }

  const folderOf = (f) => f.filename.includes('/') ? f.filename.split('/')[0] : '';
  const libSub = (f) => folderOf(f) ? '📁 ' + folderOf(f) : '音樂庫';
  const libRow = (f) => makeRow({
    key: 'lib:' + f.filename, cover: coverFor(f.filename), title: f.name, sub: libSub(f), dur: fmtSize(f.size),
    onClick: () => { history = []; play(f.filename); },
  });

  function nowKey() {
    if (currentFile) return 'lib:' + currentFile;
    if (onlineCurrent) return 'on:' + (onlineCurrent.srcUrl || onlineCurrent.url);
    return null;
  }
  function markPlaying() {
    const k = nowKey();
    let firstMatch = null;
    document.querySelectorAll('.row[data-key]').forEach((r) => {
      const on = r.dataset.key === k;
      r.classList.toggle('playing', on);
      if (on && !firstMatch && r.closest('#list')) firstMatch = r;
    });
    if (firstMatch && !$('viewLibrary').hidden) firstMatch.scrollIntoView({ block: 'nearest' });
  }

  // ── 音樂庫清單 ──────────────────────────────────────────
  async function loadList() {
    setStatus('載入清單中…', true);
    let r;
    try { r = await fetch('/web/api/list'); } catch { return setStatus('連線失敗'); }
    if (r.status === 401) { setStatus(''); return showLogin(); }
    if (!r.ok) return setStatus('讀取清單失敗');
    all = (await r.json()).files || [];
    $('logoutBtn').hidden = false;
    setStatus('');
    renderChips();
    applyFilter();
    loadCapabilities();
  }

  function renderChips() {
    const folders = [...new Set(all.map(folderOf).filter(Boolean))].sort();
    if (folder && !folders.includes(folder)) folder = '';
    const box = $('chips'); box.textContent = '';
    box.hidden = folders.length === 0;
    for (const f of ['', ...folders]) {
      const b = document.createElement('button');
      b.className = 'chip' + (f === folder ? ' active' : '');
      b.textContent = f || '全部';
      b.addEventListener('click', () => { folder = f; renderChips(); applyFilter(); });
      box.appendChild(b);
    }
  }

  function applyFilter() {
    const q = libQuery.trim().toLowerCase();
    view = all.filter(f =>
      (!folder || f.filename.startsWith(folder + '/')) &&
      (!q || f.name.toLowerCase().includes(q) || f.filename.toLowerCase().includes(q)));
    render();
  }

  function render() {
    $('libCount').textContent = all.length ? `${view.length} / ${all.length} 首` : '\u00a0';
    const ul = $('list'); ul.textContent = '';
    $('empty').hidden = view.length > 0 || !all.length;
    const frag = document.createDocumentFragment();
    for (const f of view) frag.appendChild(libRow(f));
    ul.appendChild(frag);
    markPlaying();
    renderNext();
  }

  // ── 目前播放資訊（播放列／mini／全螢幕）────────────────
  function setNow(n) {
    const t = n ? n.title : '尚未播放';
    const a = n ? n.sub : '從音樂庫或線上搜尋選一首歌';
    ['barTitle', 'miniTitle', 'fTitle'].forEach(id => { $(id).textContent = t; });
    ['barArtist', 'miniArtist', 'fArtist'].forEach(id => { $(id).textContent = a; });
    const cv = n ? n.cover : NO_COVER;
    ['barCover', 'miniCover', 'bigCover'].forEach(id => paintCover($(id), cv));
    $('full').style.setProperty('--c1', cv.c[0]);
    document.title = n ? `${n.title} · 音樂庫` : '音樂庫播放器';
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.metadata = n ? new MediaMetadata({
          title: n.title, artist: n.sub.replace(/^📁 /, ''),
          artwork: cv.img ? [{ src: cv.img }] : [],
        }) : null;
      } catch {}
    }
    markPlaying();
    renderNext();
  }

  // 全螢幕播放頁的「接下來」：線上佇列優先，其次是目前清單中的下一批
  function renderNext() {
    const ul = $('nextList'); ul.textContent = '';
    const frag = document.createDocumentFragment();
    queue.forEach((r, i) => frag.appendChild(onlineRow(r, {
      key: 'q:' + i, onClick: () => { queue.splice(i, 1); renderQueue(); playOnline(r); },
    })));
    if (!onlineCurrent && currentFile && !shuffle) {
      const i = view.findIndex(f => f.filename === currentFile);
      if (i >= 0) for (const f of view.slice(i + 1, i + 31)) frag.appendChild(libRow(f));
    } else if (shuffle && (currentFile || onlineCurrent)) {
      const li = document.createElement('li'); li.className = 'note'; li.textContent = '🔀 隨機播放中，下一首會隨機挑選'; frag.appendChild(li);
    }
    if (!frag.childNodes.length) {
      const li = document.createElement('li'); li.className = 'note'; li.textContent = '沒有下一首了'; frag.appendChild(li);
    }
    ul.appendChild(frag);
    markPlaying();
  }

  // ── 播放（音樂庫）──────────────────────────────────────
  function play(filename, { pushHistory = true } = {}) {
    const track = all.find(f => f.filename === filename); if (!track) return;
    if (pushHistory && currentFile && currentFile !== filename) history.push(currentFile);
    playToken++;
    onlineCurrent = null;
    currentFile = filename;
    audio.src = streamUrl(filename);
    audio.play().catch(() => {});
    setStatus('');
    setNow({ title: track.name, sub: libSub(track), cover: coverFor(track.filename) });
  }

  function pickNext() {
    if (!view.length) return null;
    const i = view.findIndex(f => f.filename === currentFile);
    if (shuffle) {
      if (view.length === 1) return view[0].filename;
      let n; do { n = view[Math.floor(Math.random() * view.length)].filename; } while (n === currentFile);
      return n;
    }
    if (i < 0) return view[0].filename;
    if (i + 1 < view.length) return view[i + 1].filename;
    return repeat === 'all' ? view[0].filename : null;
  }
  function next() { const n = pickNext(); if (n) play(n); }

  // 「下一首」：線上佇列優先；線上歌曲播完且佇列空了就停（同 Bot：所有歌曲播放完畢）
  function advance() {
    if (queue.length) { const it = queue.shift(); renderQueue(); playOnline(it); return; }
    if (onlineCurrent) { onlineCurrent = null; markPlaying(); setStatus('✅ 佇列播放完畢'); return; }
    next();
  }
  function prev() {
    if (onlineCurrent) { playOnline(onlineCurrent); return; }
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    if (history.length) return play(history.pop(), { pushHistory: false });
    const i = view.findIndex(f => f.filename === currentFile);
    if (i > 0) play(view[i - 1].filename, { pushHistory: false });
    else if (view.length && repeat === 'all') play(view[view.length - 1].filename, { pushHistory: false });
  }
  function toggle() {
    if (!currentFile && !onlineCurrent) { const n = pickNext(); if (n) play(n); return; }
    if (audio.paused) audio.play().catch(() => {}); else audio.pause();
  }

  // ── audio 事件 → 介面 ───────────────────────────────────
  let dragging = false;
  const seekable = () => isFinite(audio.duration) && audio.duration > 0;

  function updateProgress() {
    const can = seekable();
    const cur = audio.currentTime || 0;
    const p = can ? Math.min(100, cur / audio.duration * 100) : 0;
    for (const r of [$('seek'), $('fSeek')]) {
      r.disabled = !can;
      if (!dragging) r.value = p * 10;
      r.style.setProperty('--p', p + '%');
    }
    const durText = can ? fmt(audio.duration) : ((currentFile || onlineCurrent) ? '串流中' : '0:00');
    $('timeText').textContent = `${fmt(cur)} / ${durText}`;
    $('fCur').textContent = fmt(cur);
    $('fDur').textContent = durText;
    $('miniProg').style.width = p + '%';
  }
  function updatePlayIcons() {
    const name = audio.paused ? 'play' : 'pause';
    ['toggle', 'miniToggle', 'fToggle'].forEach(id => setIcon($(id), name));
    $('bigCover').classList.toggle('paused', audio.paused);
  }
  for (const ev of ['timeupdate', 'durationchange', 'loadedmetadata', 'emptied', 'seeked']) audio.addEventListener(ev, updateProgress);
  for (const ev of ['play', 'pause', 'ended', 'emptied']) audio.addEventListener(ev, updatePlayIcons);

  audio.addEventListener('ended', () => {
    errorStreak = 0;
    if (repeat === 'one') {
      if (onlineCurrent) playOnline(onlineCurrent);
      else { audio.currentTime = 0; audio.play().catch(() => {}); }
    } else advance();
  });
  audio.addEventListener('playing', () => { errorStreak = 0; setStatus(''); });
  audio.addEventListener('volumechange', () => {
    $('vol').value = Math.round(audio.volume * 100);
    $('vol').style.setProperty('--p', Math.round(audio.volume * 100) + '%');
    savePrefs();
  });
  audio.addEventListener('error', () => {
    if (onlineCurrent) {
      setStatus('線上串流失敗（可能被平台限制、影片不可用或伺服器忙碌）');
      if (queue.length) setTimeout(advance, 800);
      return;
    }
    if (!currentFile) return;
    errorStreak += 1;
    if (audio.error && audio.error.code === 4 && errorStreak === 1) {
      // 可能是登入過期：用清單 API 探測一下
      fetch('/web/api/list').then(r => { if (r.status === 401) showLogin('登入已過期，請重新登入'); });
    }
    setStatus('這首無法播放，已略過');
    if (errorStreak < Math.min(view.length, 5)) setTimeout(next, 800);
    else setStatus('連續多首無法播放，已停止');
  });

  // ── 控制項 ──────────────────────────────────────────────
  function syncButtons() {
    ['shuffle', 'fShuffle'].forEach(id => $(id).classList.toggle('on', shuffle));
    ['repeat', 'fRepeat'].forEach(id => {
      $(id).classList.toggle('on', repeat !== 'off');
      setIcon($(id), repeat === 'one' ? 'repeat1' : 'repeat');
      $(id).title = REPEAT_LABEL[repeat];
    });
    renderNext();
  }
  const cycleRepeat = () => { repeat = REPEATS[(REPEATS.indexOf(repeat) + 1) % REPEATS.length]; syncButtons(); savePrefs(); setStatus(REPEAT_LABEL[repeat]); };
  const toggleShuffle = () => { shuffle = !shuffle; syncButtons(); savePrefs(); setStatus(shuffle ? '🔀 隨機播放：開' : '隨機播放：關'); };

  ['toggle', 'miniToggle', 'fToggle'].forEach(id => $(id).addEventListener('click', (e) => { e.stopPropagation(); toggle(); }));
  ['next', 'miniNext', 'fNext'].forEach(id => $(id).addEventListener('click', (e) => { e.stopPropagation(); advance(); }));
  ['prev', 'fPrev'].forEach(id => $(id).addEventListener('click', prev));
  ['shuffle', 'fShuffle'].forEach(id => $(id).addEventListener('click', toggleShuffle));
  ['repeat', 'fRepeat'].forEach(id => $(id).addEventListener('click', cycleRepeat));

  for (const id of ['seek', 'fSeek']) {
    const r = $(id);
    r.addEventListener('pointerdown', () => { dragging = true; });
    const end = () => { dragging = false; };
    r.addEventListener('pointerup', end); r.addEventListener('pointercancel', end); r.addEventListener('blur', end);
    r.addEventListener('input', (e) => {
      if (!seekable()) return;
      audio.currentTime = e.target.value / 1000 * audio.duration;
      updateProgress();
    });
  }
  $('vol').addEventListener('input', (e) => { audio.volume = e.target.value / 100; });
  $('vol').value = Math.round(audio.volume * 100);
  $('vol').style.setProperty('--p', Math.round(audio.volume * 100) + '%');

  $('shuffleAll').addEventListener('click', () => {
    if (!view.length) return;
    shuffle = true; syncButtons(); savePrefs();
    history = [];
    play(view[Math.floor(Math.random() * view.length)].filename);
  });

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('previoustrack', prev);
      navigator.mediaSession.setActionHandler('nexttrack', advance);
    } catch {}
  }

  // 全螢幕播放頁
  const openFull = () => $('full').classList.add('open');
  const closeFull = () => $('full').classList.remove('open');
  $('nowOpen').addEventListener('click', openFull);
  $('expand').addEventListener('click', openFull);
  $('miniOpen').addEventListener('click', openFull);
  $('close').addEventListener('click', closeFull);
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    $('full').dataset.tab = t.dataset.tab;
  }));

  document.addEventListener('keydown', (e) => {
    if ((e.target.matches && e.target.matches('input:not([type=range]), select, textarea')) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    else if (e.key === 'n' || e.key === 'N') advance();
    else if (e.key === 'p' || e.key === 'P') prev();
    else if (e.key === 's' || e.key === 'S') toggleShuffle();
    else if (e.key === 'r' || e.key === 'R') cycleRepeat();
    else if (e.key === 'Escape') closeFull();
    else if (e.key === 'ArrowRight' && seekable()) audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
    else if (e.key === 'ArrowLeft' && seekable()) audio.currentTime = Math.max(0, audio.currentTime - 10);
  });

  // ── 頁籤切換（音樂庫／線上搜尋）────────────────────────
  function setMode(m) {
    if (m === 'online' && !onlineAvailable) m = 'library';
    mode = m;
    $('viewLibrary').hidden = m !== 'library';
    $('viewOnline').hidden = m !== 'online';
    document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === m));
    const s = $('search');
    if (m === 'online') { s.placeholder = '搜尋 YouTube / Bilibili，或貼上影片網址，按 Enter'; s.value = onlineQuery; }
    else { s.placeholder = '搜尋歌名…'; s.value = libQuery; markPlaying(); }
    $('main').scrollTop = 0;
  }
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.view)));

  $('search').addEventListener('input', () => {
    if (mode === 'library') { libQuery = $('search').value; applyFilter(); }
    else onlineQuery = $('search').value;
  });

  // ── 線上搜尋／串流（YouTube + Bilibili，伺服器端 yt-dlp）────────
  async function loadCapabilities() {
    try {
      const r = await fetch('/web/api/capabilities');
      onlineAvailable = r.ok && !!(await r.json()).online;
    } catch { onlineAvailable = false; }
    document.querySelectorAll('.needs-online').forEach(el => { el.hidden = !onlineAvailable; });
    if (!onlineAvailable && mode === 'online') setMode('library');
  }

  async function apiJson(url) {
    const r = await fetch(url);
    if (r.status === 401) { showLogin('登入已過期，請重新登入'); throw new Error('請先登入'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }

  const onlineRow = (r, { key, onClick, btn } = {}) => makeRow({
    key: key || ('on:' + r.url),
    cover: coverFor(r.url || r.title, r.thumbnail),
    title: r.title,
    sub: [r.platform, r.author].filter(Boolean).join(' · ') || '線上歌曲',
    dur: r.duration && r.duration !== '未知' ? r.duration : '',
    btn, onClick,
  });

  $('searchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = $('search').value.trim();
    if (!q) return;
    if (/^https?:\/\//i.test(q)) {                 // 貼網址：直接播放
      if (!onlineAvailable) return setStatus('伺服器未啟用線上串流（需要安裝 yt-dlp 與 ffmpeg）');
      libQuery = ''; onlineQuery = ''; $('search').value = ''; applyFilter();
      history = [];
      playOnline({ url: q, title: q });
      return;
    }
    if (mode !== 'online') { $('search').blur(); return; }
    $('onlineHint').textContent = `🔍 正在搜尋「${q}」（YouTube + Bilibili，最多約 25 秒）…`;
    $('onlineResults').textContent = '';
    try {
      const { results } = await apiJson('/web/api/search?q=' + enc(q));
      $('onlineHint').textContent = results.length ? `找到 ${results.length} 筆。點一下立即播放，「＋」加入佇列。` : '找不到相關結果';
      const ul = $('onlineResults');
      for (const r of results) {
        ul.appendChild(onlineRow(r, {
          onClick: () => { history = []; playOnline(r); },
          btn: { icon: 'plus', title: '加入佇列', onClick: () => { queue.push(r); renderQueue(); setStatus('已加入佇列：' + r.title); } },
        }));
      }
      markPlaying();
    } catch (err) { $('onlineHint').textContent = '❌ ' + err.message; }
  });

  function renderQueue() {
    $('queueSection').hidden = queue.length === 0;
    $('queueCount').textContent = `${queue.length} 首`;
    const ul = $('queueList'); ul.textContent = '';
    queue.forEach((r, i) => {
      ul.appendChild(onlineRow(r, {
        key: 'qq:' + i,
        onClick: () => { queue.splice(i, 1); renderQueue(); playOnline(r); },
        btn: { icon: 'close', title: '移出佇列', onClick: () => { queue.splice(i, 1); renderQueue(); } },
      }));
    });
    renderNext();
  }
  $('queueClear').addEventListener('click', () => { queue.length = 0; renderQueue(); });

  // 流程同 Bot：先取得影片資訊（伺服器需要時長判斷要不要下載快取）→ 再開始播放
  async function playOnline(item) {
    const token = ++playToken;
    currentFile = null;
    onlineCurrent = { ...item, srcUrl: item.url };
    audio.pause();
    setNow({
      title: item.title,
      sub: [item.platform, item.author].filter(Boolean).join(' · ') || '線上歌曲',
      cover: coverFor(item.url || item.title, item.thumbnail),
    });
    setStatus('🔍 正在獲取影片資訊…', true);
    let info;
    try { info = await apiJson('/web/api/info?url=' + enc(item.url)); }
    catch (err) {
      if (token !== playToken) return;
      setStatus('❌ ' + err.message);
      if (queue.length) setTimeout(advance, 1200);
      else { onlineCurrent = null; markPlaying(); }
      return;
    }
    if (token !== playToken) return;
    onlineCurrent = { ...item, ...info, srcUrl: item.url };
    setNow({
      title: info.title,
      sub: [item.platform, info.author].filter(Boolean).join(' · ') || '線上歌曲',
      cover: coverFor(item.url || info.url, info.thumbnail || item.thumbnail),
    });
    audio.src = '/web/play?url=' + enc(info.url);
    audio.play().catch(() => {});
    setStatus('⏳ 載入中（未快取的歌曲需要伺服器先取得串流，可能要幾秒；下次播放會有快取並可拖曳進度）', true);
  }

  setNow(null);
  syncButtons();
  updateProgress();
  updatePlayIcons();
  loadList();
})();
</script>
</body>
</html>
