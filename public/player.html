<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0b">
<title>音樂庫播放器</title>
<link rel="stylesheet" href="/player-assets/player.css">
</head>
<body>

<svg style="display:none">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6v12h2V6z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M10.6 9.2L5.4 4 4 5.4l5.2 5.2zM14.5 4l2.05 2.05L4 18.6 5.4 20l12.55-12.55L20 9.5V4zm.3 9.4l-1.4 1.4 3.15 3.15L14.5 20H20v-5.5l-2.05 2.05z"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></symbol>
  <symbol id="i-repeat1" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2zm-4-2V9h-1l-2 1v1h1.5v4z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0014 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></symbol>
  <symbol id="i-explore" viewBox="0 0 24 24"><path d="M12 10.9a1.1 1.1 0 100 2.2 1.1 1.1 0 000-2.2zM12 2a10 10 0 100 20 10 10 0 000-20zm2.2 12.2L6 18l3.8-8.2L18 6z"/></symbol>
  <symbol id="i-lib" viewBox="0 0 24 24"><path d="M4 6H2v14a2 2 0 002 2h14v-2H4zm16-4H8a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2zm-2 9.5l-4-2.2V14a2.5 2.5 0 11-1.5-2.3V5h2.5l3 2z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><path d="M9 6a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm6 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zM9 13.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm6 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zM9 21a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm6 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/></symbol>
</svg>

<audio id="audio" preload="none"></audio>

<header>
  <div class="logo"><i></i><span>音樂庫</span></div>
  <form class="search" id="searchForm" role="search">
    <svg><use href="#i-search"/></svg>
    <input type="search" id="search" placeholder="搜尋歌名…" autocomplete="off" enterkeyhint="search">
  </form>
  <button class="avatar" id="logoutBtn" title="登出" aria-label="登出" hidden><svg><use href="#i-logout"/></svg></button>
</header>

<aside>
  <button class="navitem active" data-view="library"><svg><use href="#i-lib"/></svg>音樂庫</button>
  <button class="navitem needs-online" data-view="online" hidden><svg><use href="#i-explore"/></svg>線上搜尋</button>
  <div class="side-sep"></div>
  <div class="side-note">快捷鍵<br>空白：播放／暫停<br>N／P：下一首／上一首<br>S：隨機　R：循環<br>←／→：快退／快進 10 秒</div>
</aside>

<main id="main">
  <div id="viewLibrary">
    <div class="chips" id="chips" hidden></div>
    <section>
      <div class="sec-head">
        <div><small id="libCount">&nbsp;</small><h2>音樂庫</h2></div>
        <button class="more" id="shuffleAll">🔀 隨機播放</button>
      </div>
      <ul class="quick" id="list"></ul>
      <div class="empty" id="empty" hidden>沒有符合的曲目</div>
    </section>
  </div>

  <div id="viewOnline" hidden>
    <section style="margin-top:0">
      <div class="sec-head"><div><small>YouTube + Bilibili</small><h2>線上搜尋</h2></div></div>
      <div class="hint" id="onlineHint">在上方搜尋列輸入關鍵字後按 Enter，或直接貼上影片網址。點一下立即播放，「＋」加入佇列。</div>
      <ul class="quick" id="onlineResults"></ul>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="player">
  <div class="bar-progress"><input type="range" id="seek" min="0" max="1000" value="0" disabled aria-label="播放進度"></div>
  <div class="ctrls">
    <button id="prev" title="上一首 (P)"><svg><use href="#i-prev"/></svg></button>
    <button class="big" id="toggle" title="播放／暫停 (空白)"><svg><use href="#i-play"/></svg></button>
    <button id="next" title="下一首 (N)"><svg><use href="#i-next"/></svg></button>
    <span class="time" id="timeText">0:00 / 0:00</span>
  </div>
  <div class="now" id="nowOpen">
    <div class="cover" id="barCover"></div>
    <div class="info"><div class="t" id="barTitle"></div><div class="a" id="barArtist"></div></div>
  </div>
  <div class="right">
    <div class="vol"><svg style="margin-right:6px;color:#ccc"><use href="#i-vol"/></svg><input type="range" id="vol" min="0" max="100" value="100" aria-label="音量"></div>
    <button id="repeat" title="循環模式 (R)"><svg><use href="#i-repeat"/></svg></button>
    <button id="shuffle" title="隨機播放 (S)"><svg><use href="#i-shuffle"/></svg></button>
    <button id="expand" title="展開"><svg><use href="#i-up"/></svg></button>
  </div>
</div>

<div class="mini" id="mini">
  <div class="mini-in" id="miniOpen">
    <div class="cover" id="miniCover"></div>
    <div class="info"><div class="t" id="miniTitle"></div><div class="a" id="miniArtist"></div></div>
    <button id="miniToggle" aria-label="播放／暫停"><svg><use href="#i-play"/></svg></button>
    <button id="miniNext" aria-label="下一首"><svg><use href="#i-next"/></svg></button>
  </div>
  <div class="mini-prog" id="miniProg"></div>
</div>

<nav class="bottom-nav">
  <button class="active" data-view="library"><svg><use href="#i-lib"/></svg>音樂庫</button>
  <button class="needs-online" data-view="online" hidden><svg><use href="#i-explore"/></svg>線上搜尋</button>
</nav>

<div class="full" id="full" data-tab="player">
  <div class="full-top">
    <button id="close" aria-label="收合"><svg><use href="#i-down"/></svg></button>
    <div class="tabs">
      <button class="tab active" data-tab="player">歌曲</button>
      <button class="tab" data-tab="queue">佇列</button>
    </div>
    <span style="width:44px;flex-shrink:0"></span>
  </div>
  <div class="full-body">
    <div class="left-pane">
      <div class="cover big-cover" id="bigCover"></div>
      <div class="meta"><div class="t" id="fTitle"></div><div class="a" id="fArtist"></div></div>
      <div class="seek">
        <input type="range" id="fSeek" min="0" max="1000" value="0" disabled aria-label="播放進度">
        <div class="times"><span id="fCur">0:00</span><span id="fDur">0:00</span></div>
      </div>
      <div class="fctrls">
        <button id="fShuffle" aria-label="隨機播放"><svg><use href="#i-shuffle"/></svg></button>
        <button id="fPrev" aria-label="上一首"><svg><use href="#i-prev"/></svg></button>
        <button class="play-big" id="fToggle" aria-label="播放／暫停"><svg><use href="#i-play"/></svg></button>
        <button id="fNext" aria-label="下一首"><svg><use href="#i-next"/></svg></button>
        <button id="fRepeat" aria-label="循環模式"><svg><use href="#i-repeat"/></svg></button>
      </div>
    </div>
    <div class="queue">
      <div class="queue-head"><h3 id="queueTitle">佇列</h3><button id="reshuffle" hidden>重新洗牌</button></div>
      <ul id="nextList"></ul>
    </div>
  </div>
</div>

<div class="login" id="login">
  <form class="box" id="loginForm">
    <div class="logo"><i></i><span>音樂庫</span></div>
    <p>請輸入密碼</p>
    <input type="password" id="pw" placeholder="密碼" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="go" type="submit">登入</button>
  </form>
</div>

<script src="/player-assets/player.js"></script>
</body>
</html>
